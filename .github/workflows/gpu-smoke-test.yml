# Checks a deployed GPU runner end to end, without any project code: the job
# reaches the VM, the GPU lock hooks run, and the GPU is visible. Run it by
# hand after deploying (Actions → GPU smoke test → Run workflow).
#
# It must be listed in the org's `middle-earth-gpu` runner group as
#   dirac-institute/middle-earth-gpu/.github/workflows/gpu-smoke-test.yml@refs/heads/main
#
# Manual trigger only. Do not add pull_request, pull_request_target or
# workflow_run triggers (DEPLOY.md, "GitHub-side setup").

name: GPU smoke test

on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: "How long to hold the GPU lock (for testing the lock by hand)"
        default: "0"
  # SECURITY TEST ONLY - DO NOT MERGE. Simulates a pull request that edits an
  # allowlisted workflow to run on pull_request. The runner group only accepts
  # this file at refs/heads/main, so this job must stay queued forever and
  # never reach the VM (HANDOFF.md, "Fork pull request").
  pull_request:

permissions: {}

jobs:
  smoke:
    runs-on:
      group: middle-earth-gpu
      labels: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - name: SECURITY TEST - fail if a pull request reached the runner
        if: github.event_name == 'pull_request'
        run: |
          echo "::error::A pull_request job reached the self-hosted GPU runner. The runner group's workflow restrictions are NOT working. See DEPLOY.md, \"GitHub-side setup\"."
          exit 1

      - name: Variables from the job-started hook
        run: |
          echo "GPU_LOCK_OWNER=$GPU_LOCK_OWNER"
          echo "GPU_LOCK_WAIT_SECONDS=$GPU_LOCK_WAIT_SECONDS"
          echo "GPU_DRIVER_VERSION=$GPU_DRIVER_VERSION"
          test -n "$GPU_LOCK_OWNER" && test -n "$GPU_DRIVER_VERSION"

      - name: GPU and lock
        run: |
          nvidia-smi
          cat /gpu-lock/held/owner /gpu-lock/held/info

      - name: No container engine or sudo
        # `! cmd` never trips `set -e` in bash, so each check exits explicitly.
        run: |
          if test -S /var/run/docker.sock; then echo "::error::docker socket is mounted"; exit 1; fi
          if sudo -n true 2>/dev/null; then echo "::error::sudo works"; exit 1; fi
          echo "No container socket; sudo is refused."

      - name: Hold the GPU
        env:
          HOLD: ${{ inputs.hold_seconds }}
        run: |
          [[ "$HOLD" =~ ^[0-9]+$ ]] || { echo "hold_seconds must be a number"; exit 1; }
          sleep "$HOLD"
